conda_build:
  error_overlinking: true
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
# necessary to build flang-rt_<target> on windows, as it's the only output, and noarch
noarch_platforms:
  - linux_64
  - win_64
  - win_arm64
provider:
  win_arm64: default
