{% set version = "23.1.0" %}
{% set major = version.split(".")[0] %}
{% set win_target_triple = "aarch64-pc-windows-msvc" if target_platform == "win-arm64" else "x86_64-pc-windows-msvc" %}

package:
  name: flang-rt-split
  version: {{ version }}

source:
  url: https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-{{ version.replace(".rc", "-rc") }}.tar.gz
  sha256: d8657b2a7291e518407bf13c4b41c85ef2cded2d4354097a2f451644dfc817b0

build:
  number: 1
  # intentionally only windows (main target) & linux (debuggability)
  skip: true  # [osx]

requirements:
  build:
    - cmake
    - ninja
    - python *
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - flang =={{ version }}
    # only to avoid pulling in newer rc's which have a different SONAME
    - libllvm{{ major }} =={{ version }}
    # flang looks for libmlir relative to its binary; since we're only
    # doing native compilation here, accept this inaccuracy
    - mlir =={{ version }}
  host:
    - clangdev =={{ version }}
    - compiler-rt =={{ version }}
    - llvmdev =={{ version }}
    - mlir =={{ version }}

outputs:
  - name: libflang-rt
    build:
      # not supported on windows yet, see
      # https://github.com/llvm/llvm-project/issues/134186
      skip: true  # [win]
    files:
      - lib/libflang_rt.runtime.so  # [linux]
    requirements:
      build:
        # for strong run-exports
        - {{ stdlib('c') }}
      run_constrained:
        # avoid old flang runtime
        - libflang <0.0a0
    test:
      commands:
        # shared library; copied from target-specific location
        - test -f $PREFIX/lib/libflang_rt.runtime.so    # [linux]

  - name: flang-rt_{{ target_platform }}
    build:
      noarch: generic
    files:
      - lib/clang/{{ major }}/lib/x86_64-unknown-linux-gnu/libflang_rt.runtime.a                # [linux]
      - lib/clang/{{ major }}/lib/x86_64-unknown-linux-gnu/libflang_rt.runtime.so               # [linux]
      # corresponding to different flavours of the MSVC runtime, i.e. `/MD`, `/MDd`, `/MT`, `/MTd`
      - Library/lib/clang/{{ major }}/lib/{{ win_target_triple }}/flang_rt.runtime.static.lib    # [win]
      - Library/lib/clang/{{ major }}/lib/{{ win_target_triple }}/flang_rt.runtime.dynamic.lib   # [win]
      - Library/lib/clang/{{ major }}/lib/{{ win_target_triple }}/flang_rt.runtime.static_dbg.lib    # [win]
      - Library/lib/clang/{{ major }}/lib/{{ win_target_triple }}/flang_rt.runtime.dynamic_dbg.lib   # [win]
    requirements:
      build:
        # for strong run-exports
        - {{ stdlib('c') }}     # [linux]
      host:
        - clangdev =={{ version }}
        - compiler-rt =={{ version }}
        - llvmdev =={{ version }}
        - mlir =={{ version }}
      run:
        - clangdev =={{ version }}
        - flang =={{ version }}
    test:
      commands:
        # target-specific runtime library location (default for flang)
        - test -f $PREFIX/lib/clang/{{ major }}/lib/x86_64-unknown-linux-gnu/libflang_rt.runtime.a                      # [linux]
        - test -f $PREFIX/lib/clang/{{ major }}/lib/x86_64-unknown-linux-gnu/libflang_rt.runtime.so                     # [linux]
        - if not exist %LIBRARY_LIB%\clang\{{ major }}\lib\{{ win_target_triple }}\flang_rt.runtime.static.lib exit 1    # [win]
        - if not exist %LIBRARY_LIB%\clang\{{ major }}\lib\{{ win_target_triple }}\flang_rt.runtime.dynamic.lib exit 1   # [win]
        - if not exist %LIBRARY_LIB%\clang\{{ major }}\lib\{{ win_target_triple }}\flang_rt.runtime.static_dbg.lib exit 1    # [win]
        - if not exist %LIBRARY_LIB%\clang\{{ major }}\lib\{{ win_target_triple }}\flang_rt.runtime.dynamic_dbg.lib exit 1   # [win]

  - name: llvm-openmp-fortran
    script: install_openmp_mod.bat
    build:
      # restricted to win64 for now
      skip: true  # [not (win and x86_64)]
      run_exports:
        strong:
          - llvm-openmp >={{ version }}
    requirements:
      build:
        - cmake
        - ninja
        - {{ stdlib("c") }}
        - {{ compiler("cxx") }}
        - flang
      host:
        - llvm-openmp {{ version }}
        - {{ pin_subpackage("flang-rt_" ~ target_platform, exact=True) }}
      run:
        - llvm-openmp {{ version }}
        - {{ pin_subpackage("flang-rt_" ~ target_platform, exact=True) }}
      run_constrained:
        # already contains the version
        - {{ compiler("fortran") }}
    test:
      commands:
        - if not exist %LIBRARY_INC%\omp_lib.mod exit 1
        - if not exist %LIBRARY_INC%\omp_lib_kinds.mod exit 1

about:
  home: https://flang.llvm.org
  license: Apache-2.0
  license_file: flang/LICENSE.TXT
  summary: Flang is a Fortran compiler targeting LLVM.
  dev_url: https://github.com/llvm/llvm-project

extra:
  recipe-maintainers:
    - conda-forge/flang
    - h-vetinari
  feedstock-name: flang-rt
